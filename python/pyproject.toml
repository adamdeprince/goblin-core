# Editable/wheel build via scikit-build-core + nanobind. For a plain CMake build
# (no pip), see CMakeLists.txt. Either way you need nanobind >= 2.12.
#
#   pip install ./python          # builds the extension and installs goblin_core
[build-system]
requires = ["scikit-build-core>=0.10,<1", "nanobind>=2.12"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "goblin-core"
dynamic = ["version"]
description = "redis-py-compatible SBE clients for goblin-core rings, RDMA, ExaSock, and Aeron UDP/IPC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Goblin Reactor" }]
keywords = ["redis", "ring-buffer", "shared-memory", "nanobind", "aeron", "udp", "ipc", "rdma"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["goblin_core"]

[tool.scikit-build.cmake]
version = ">=3.25"

[tool.scikit-build.sdist]
include = ["_vendor/**", "build_backend.py", "LICENSE", "NOTICE"]
exclude = ["build/**", "dist/**", "goblin_core/*.so", "goblin_core/*.dylib"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "_vendor/CMakeLists.txt"
regex = '(?s)project\(goblin-core\s+VERSION\s+(?P<value>\d+\.\d+\.\d+)'
